<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreame</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>

<!-- Kartengeruest (Etappe B, Commit B5). DOM-IDs entsprechen www/legacy.html, damit
     www/js/karte/*.js unveraendert darauf zugreifen kann (document.getElementById('map')
     usw., siehe Zustand-Setup in js/main.js). Panels (Etappe C/D) kommen als eigene
     .side-Spalte hinzu, existiert hier noch nicht — "keine Steuerung" laut Plan. -->
<div class="app">
  <div class="body">
    <div class="stage" id="stage">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map"></canvas>
        <svg id="overlay"></svg>
      </div>
      <div class="maptag links" id="devName"></div>
      <div class="maptag rechts" id="conn">…</div>
      <div class="zoom">
        <button id="z-in" title="Zoom +" aria-label="Vergrößern">+</button>
        <button id="z-out" title="Zoom −" aria-label="Verkleinern">−</button>
        <button id="z-reset" title="Zurücksetzen" aria-label="Ansicht zurücksetzen">⤢</button>
      </div>
    </div>
  </div>
</div>
<div id="err" style="position:fixed;bottom:8px;left:8px;color:#ff8098;font-size:12px;white-space:pre-wrap"></div>

<!-- Icon-Sets, von legacy.html unveraendert uebernommen (siehe Commit B1). -->
<script src="icons.js"></script>
<script src="icons_ui.js"></script>

<!-- Karten-Kern, Ricardos Portierung 1:1 uebernommen (Etappe B, Commit B2 + B5-Nachtrag). -->
<script src="js/karte/merger.js"></script>
<script src="js/karte/render.js"></script>
<script src="js/karte/overlays.js"></script>

<!-- Datenlayer (Etappe B, Commit B3). -->
<script src="js/core/daten.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/geraete.js"></script>
<script src="js/core/trigger.js"></script>

<!-- Panel-Basis + Panels (Etappe B Commit B4, Etappe C, Etappe D). -->
<script src="js/panels/panel.js"></script>
<script src="js/panels/kopf.js"></script>
<script src="js/panels/reinigung.js"></script>
<script src="js/panels/wartung.js"></script>
<script src="js/panels/statistik.js"></script>
<script src="js/panels/station.js"></script>
<script src="js/panels/fehler.js"></script>
<script src="js/panels/frischwasser.js"></script>
<script src="js/panels/mopp.js"></script>

<!-- Startpunkt (Etappe B, Commit B5). -->
<script src="js/main.js"></script>

</body>
</html>
