<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreame</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>

<!-- Kartengeruest (Etappe B, Commit B5). DOM-IDs entsprechen www/legacy.html, damit
     www/js/karte/*.js unveraendert darauf zugreifen kann (document.getElementById('map')
     usw., siehe Zustand-Setup in js/main.js). Seitenleiste (.side/.sidein) kommt mit den
     Panels aus Etappe C dazu — jede section.gruppe traegt id="panel-<id>", damit main.js
     sie ueber PanelRegistry.aktive() dem passenden Panel als Container zuordnen kann. -->
<div class="app">
  <div class="body">
    <div class="stage" id="stage">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map"></canvas>
        <svg id="overlay"></svg>
      </div>
      <div class="maptag links" id="devName"></div>
      <div class="maptag rechts" id="conn">…</div>
      <div class="zoom">
        <button id="z-in" title="Zoom +" aria-label="Vergrößern">+</button>
        <button id="z-out" title="Zoom −" aria-label="Verkleinern">−</button>
        <button id="z-reset" title="Zurücksetzen" aria-label="Ansicht zurücksetzen">⤢</button>
      </div>
    </div>
    <div class="side"><div class="sidein">
      <!-- Kopf-Panel (Etappe C, Commit C1). Zahnrad fehlt bewusst noch — das Einstellungs-
           Overlay, das es oeffnet, kommt erst in Etappe E. -->
      <section class="gruppe g-kopf" id="panel-kopf">
        <div class="kopfstatus">
          <div class="stext" id="stateText">–</div>
          <div class="ssub" id="stateSub">–</div>
        </div>
        <div class="inforeihe" id="infoReihe">
          <div class="infoitem"><span class="info-val" id="info-akku">–</span><span class="info-lbl">Akku</span></div>
          <div class="infoitem"><span class="info-val" id="info-reinigung">–</span><span class="info-lbl">Reinigung</span></div>
          <div class="infoitem"><span class="info-val" id="info-flaeche">–</span><span class="info-lbl">Fläche</span></div>
        </div>
        <div class="warnbox" id="warnBox" hidden></div>
        <div class="actbtns">
          <button class="abtn start" id="c-start" title="Start" aria-label="Reinigung starten">
            <span class="abtext">Start</span>
          </button>
          <button class="abtn stop" id="c-stop" title="Stop" aria-label="Reinigung anhalten"></button>
          <button class="abtn home" id="c-home" title="Home" aria-label="Zurück zur Ladestation"></button>
        </div>
      </section>
      <!-- Reinigungs-Panel (Etappe C, Commit C5): Kachel-Grid (Modus/Route/Saug/Wasser),
           Betriebsart, Raumauswahl-Anzeige. Bewusst ohne Auswahl-Overlay (siehe
           reinigung.js-Kommentarkopf) -- direkte <select>-Elemente statt Dialog. -->
      <section class="gruppe g-reinigung" id="panel-reinigung">
        <div class="abschnitt">
          <h2>Reinigung</h2>
        </div>
        <div class="rraum" id="reinigungRaum">Raum antippen zum Wählen</div>
        <div class="rgrid">
          <label class="rkarte" id="reinigungModusKarte">
            <span class="rk">Modus</span>
            <select id="reinigungModus"></select>
          </label>
          <label class="rkarte">
            <span class="rk">Route</span>
            <select id="reinigungRoute"></select>
          </label>
          <label class="rkarte">
            <span class="rk">Saugstärke</span>
            <select id="reinigungSaug"></select>
          </label>
          <label class="rkarte" id="reinigungWasserKarte">
            <span class="rk">Feuchtigkeit <span class="rkwert" id="reinigungWasserWert"></span></span>
            <input type="range" id="reinigungWasser" min="1" max="32" step="1">
          </label>
        </div>
      </section>
      <!-- Wartungs-Panel (Etappe C, Commit C2): Verschleiss + Reset, optional Saugbeutel. -->
      <section class="gruppe g-wartung" id="panel-wartung">
        <div class="abschnitt">
          <h2 id="wartungTitel" hidden>Wartung</h2>
        </div>
        <div class="verbrauch" id="wartungListe"></div>
      </section>
      <!-- Statistik-Panel (Etappe C, Commit C3): Gesamt-Reinigungsstatistiken. -->
      <section class="gruppe g-statistik" id="panel-statistik">
        <div class="abschnitt">
          <h2 id="statistikTitel" hidden>Statistik</h2>
        </div>
        <div class="statlist" id="statistikListe"></div>
      </section>
      <!-- Station-Panel (Etappe C, Commit C4): Waschstations-Zustand + Aktionen. Bewusst
           ohne Bestaetigungsdialog (siehe station.js-Kommentarkopf) -- direkte Knoepfe. -->
      <section class="gruppe g-station" id="panel-station">
        <div class="abschnitt">
          <h2 id="stationTitel" hidden>Station</h2>
        </div>
        <div class="saktionen" id="stationAktionen"></div>
      </section>
    </div></div>
  </div>
</div>
<div id="err" style="position:fixed;bottom:8px;left:8px;color:#ff8098;font-size:12px;white-space:pre-wrap"></div>

<!-- Icon-Sets, von legacy.html unveraendert uebernommen (siehe Commit B1). -->
<script src="icons.js"></script>
<script src="icons_ui.js"></script>

<!-- Karten-Kern, Ricardos Portierung 1:1 uebernommen (Etappe B, Commit B2 + B5-Nachtrag). -->
<script src="js/karte/merger.js"></script>
<script src="js/karte/render.js"></script>
<script src="js/karte/overlays.js"></script>

<!-- Datenlayer (Etappe B, Commit B3). -->
<script src="js/core/daten.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/geraete.js"></script>
<script src="js/core/trigger.js"></script>

<!-- Panel-Basis + Panels (Etappe B Commit B4, Etappe C, Etappe D). -->
<script src="js/panels/panel.js"></script>
<script src="js/panels/kopf.js"></script>
<script src="js/panels/reinigung.js"></script>
<script src="js/panels/wartung.js"></script>
<script src="js/panels/statistik.js"></script>
<script src="js/panels/station.js"></script>
<script src="js/panels/fehler.js"></script>
<script src="js/panels/frischwasser.js"></script>
<script src="js/panels/mopp.js"></script>

<!-- Startpunkt (Etappe B, Commit B5). -->
<script src="js/main.js"></script>

</body>
</html>
